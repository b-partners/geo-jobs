name: Redrive DLQ to its source

on:
  schedule:
    - cron: "*/1 * * * *"
  workflow_dispatch:

jobs:
  dlq-redrive:
    if: ${{ github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/preprod' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      AWS_REGION: eu-west-3

    steps:
      - uses: actions/checkout@v4.1.6

      - uses: hei-school/aws-credentials-setter@v1.0.3
        with:
          secrets: ${{ toJSON(secrets) }}
          region: ${{ env.AWS_REGION }}

      - name: Redrive DLQ 1
        run: |
          RESPONSE=$(aws sqs receive-message \
          --queue-url https://sqs.eu-west-3.amazonaws.com/205205101409/prod-1-geo-jobs-dl)
        
          if [[ -n "$RESPONSE" && $(echo "$RESPONSE" | jq '.Messages | length > 0' -e) ]]; then
          echo "Messages found. Starting to redrive them to its source."
        
          aws sqs start-message-move-task \
          --source-arn arn:aws:sqs:eu-west-3:205205101409:prod-1-geo-jobs-dl
          else
          echo "No messages found. Do not redrive."
          fi

      - name: Redrive DLQ 2
        run: |
          RESPONSE=$(aws sqs receive-message \
          --queue-url https://sqs.eu-west-3.amazonaws.com/205205101409/prod-2-geo-jobs-dl)
          
          if [[ -n "$RESPONSE" && $(echo "$RESPONSE" | jq '.Messages | length > 0' -e) ]]; then
          echo "Messages found. Starting to redrive them to its source."
          
          aws sqs start-message-move-task \
          --source-arn arn:aws:sqs:eu-west-3:205205101409:prod-2-geo-jobs-dl
          else
          echo "No messages found. Do not redrive."
          fi